{% extends "base.html" %}

{% block content %}
  <table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Drivers</th>
    </tr>
  </thead>
  <tbody>
    {% for car in cars %}
    <tr>
      <td>
        <a href="cars/{{car.id}}">
          {{ car.id }}
        </a>
        </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer }}</td>
      <td>{{ car.drivers }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
