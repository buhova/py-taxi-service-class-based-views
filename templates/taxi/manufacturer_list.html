{% extends "base.html" %}

{% block content %}
  <table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Country</th>
    </tr>
  </thead>
  <tbody>
    {% for manufacturer in manufacturers %}
    <tr>
      <td>{{ manufacturer.id }}</td>
      <td>{{ manufacturer.name }}</td>
      <td>{{ manufacturer.country }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
